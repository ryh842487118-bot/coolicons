name: Publish Flutter package

on:
  workflow_run:
    workflows: ["Flutter package"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  check-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.check.outputs.already_published }}
      current_main: ${{ steps.version.outputs.current_main }}
    steps:
      - name: Checkout the successful CI commit
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Read Flutter version and ensure this is still current main
        id: version
        run: |
          version="$(awk '/^version:/{print $2; exit}' packages/flutter/pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          latest_main="$(git rev-parse HEAD)"
          run_sha="${{ github.event.workflow_run.head_sha }}"
          parent="$(git rev-parse HEAD^ 2>/dev/null || true)"
          subject="$(git log -1 --pretty=%s)"
          if [ "$latest_main" = "$run_sha" ] || { [ "$parent" = "$run_sha" ] && [ "$subject" = "build(flutter): generate catalog and format sources" ]; }; then
            echo "current_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "current_main=false" >> "$GITHUB_OUTPUT"
            echo "This successful Flutter CI run does not match current main; skip publishing."
          fi
      - name: Skip if this exact version is already published
        id: check
        if: steps.version.outputs.current_main == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          encoded_version="$(printf '%s' "$VERSION" | jq -sRr @uri)"
          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pub.dev/api/packages/coolicons_flutter/versions/$encoded_version")"
          if [ "$status" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "coolicons_flutter $VERSION already exists on pub.dev."
          elif [ "$status" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected pub.dev response: HTTP $status"
            exit 1
          fi

  publish:
    needs: [check-version]
    if: ${{ needs.check-version.outputs.current_main == 'true' && needs.check-version.outputs.already_published == 'false' }}
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
