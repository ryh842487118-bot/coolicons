name: Tag and publish releases

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "packages/flutter/pubspec.yaml"

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect changed package versions and publish tags
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch creation; no previous version to compare."
            exit 0
          fi

          old_root="$(git show "$BEFORE_SHA:package.json" | jq -r .version)"
          root_version="$(jq -r .version package.json)"
          old_flutter="$(git show "$BEFORE_SHA:packages/flutter/pubspec.yaml" | awk '/^version:/{print $2; exit}')"
          flutter_version="$(awk '/^version:/{print $2; exit}' packages/flutter/pubspec.yaml)"
          flutter_base="${flutter_version%%+*}"

          if ! [[ "$root_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid monorepo version: $root_version"
            exit 1
          fi
          if [ "$flutter_base" != "$root_version" ] || ! [[ "$flutter_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?(\+[0-9]+)?$ ]]; then
            echo "Flutter version $flutter_version must be $root_version or $root_version+N."
            exit 1
          fi

          root_changed=false
          flutter_changed=false
          [ "$old_root" != "$root_version" ] && root_changed=true
          [ "$old_flutter" != "$flutter_version" ] && flutter_changed=true

          if [ "$root_changed" = "true" ]; then
            tag="v$root_version"
            git fetch origin --tags
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if ! git merge-base --is-ancestor "$tag" "$CURRENT_SHA"; then
                echo "Tag $tag exists but is not an ancestor of main."
                exit 1
              fi
            else
              git tag "$tag" "$CURRENT_SHA"
              git push origin "$tag"
            fi
            echo "Pushed $tag for the monorepo release."
          fi

          if [ "$flutter_changed" = "true" ]; then
            encoded_version="$(printf '%s' "$flutter_version" | jq -sRr @uri)"
            status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pub.dev/api/packages/coolicons_flutter/versions/$encoded_version")"
            if [ "$status" = "200" ]; then
              echo "coolicons_flutter $flutter_version is already on pub.dev."
              exit 0
            elif [ "$status" != "404" ]; then
              echo "Unexpected pub.dev response: HTTP $status"
              exit 1
            fi
            tag="flutter-v$flutter_version"
            git fetch origin --tags
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists; not overwriting it."
              exit 1
            fi
            git tag "$tag" "$CURRENT_SHA"
            git push origin "$tag"
            gh workflow run publish-flutter.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
            echo "Pushed $tag and dispatched the Flutter-only publisher."
          fi
