name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: release
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME" notes.md
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:packages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify generated Flutter catalog is committed
        run: |
          node scripts/build-flutter.mjs
          dart format packages/flutter/lib packages/flutter/test packages/flutter/example/lib
          git diff --exit-code -- packages/flutter/lib/src/generated
      - name: Test Flutter package
        working-directory: packages/flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib
          flutter analyze
          flutter test
          flutter pub publish --dry-run
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          (cd icons && zip -qr "../coolicons-$VERSION.zip" svg manifest.json)
          zip -q "coolicons-$VERSION.zip" LICENSE
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "coolicons-$VERSION.zip" --title "coolicons $VERSION" --notes-file notes.md "${flags[@]}"



  check-flutter-pubdev:
    runs-on: ubuntu-latest
    outputs:
      package_exists: ${{ steps.check.outputs.package_exists }}
      version_exists: ${{ steps.check.outputs.version_exists }}
    steps:
      - name: Check whether the Flutter package and version exist
        id: check
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          package_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pub.dev/api/packages/coolicons_flutter")"
          if [ "$package_status" = "404" ]; then
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "coolicons_flutter has not had its first manual pub.dev publication yet; skipping automated publish."
            exit 0
          elif [ "$package_status" != "200" ]; then
            echo "Unexpected pub.dev package response: HTTP $package_status"
            exit 1
          fi

          echo "package_exists=true" >> "$GITHUB_OUTPUT"
          version_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pub.dev/api/packages/coolicons_flutter/versions/${version}")"
          if [ "$version_status" = "200" ]; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$version_status" = "404" ]; then
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected pub.dev version response: HTTP $version_status"
            exit 1
          fi

  publish-flutter:
    needs: [publish, check-flutter-pubdev]
    if: needs.check-flutter-pubdev.outputs.package_exists == 'true' && needs.check-flutter-pubdev.outputs.version_exists != 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
